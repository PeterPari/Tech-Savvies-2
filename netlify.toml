# Netlify settings: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Plain HTML/CSS/JS, so there is no build step. Netlify publishes this folder as-is.
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Only files from this site may load. If you later add a third-party script,
    # font, video embed or analytics tool, add its domain here or it will be blocked.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Font files never change, so browsers can keep them for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# BEGIN plain-text mirrors: generated by tools/build_markdown.py, do not edit by hand
[[headers]]
  for = "/404.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/accessibility.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Link = "<https://tech-savvies.com/accessibility/>; rel=\"canonical\""

