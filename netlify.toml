# Old site (before the 2026 relaunch): send every URL that search engines and old links know to the
# matching new page. Keep these for good: removing one turns old search results and links into 404s.
# A rule only applies while no file in public/ has the same path, and /contact needs no rule (Netlify
# adds the slash itself). LEGACY_REDIRECTS in tools/check_site.py must list the same rules; see
# migration-plan.md.
[[redirects]]
  from = "/services"
  to = "/solutions/"
  status = 301

