name: Site checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site checker
        run: python3 tools/check_site.py
      - name: Admin page is up to date
        run: python3 tools/build_admin.py --check
      - name: Plain-text mirrors are up to date
        run: python3 tools/build_markdown.py --check
